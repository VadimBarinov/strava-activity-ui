services:
  app:
    build:
      context: .
      args:
        BASE_IMAGE: python:3.13-slim
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - .:/app
    stdin_open: true
    tty: true
    depends_on:
      - db
      - redis
    networks:
      - app-shared-network
      - backend
  worker:
    build:
      context: .
      args:
        BASE_IMAGE: python:3.13-slim
    env_file:
      - .env
    stdin_open: true
    tty: true
    command: ["uv", "run", "rq", "worker", "default"]
    depends_on:
      - db
      - redis
    networks:
      - app-shared-network
      - backend
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: strava_activity
      POSTGRES_USER: user_qwerty
      POSTGRES_PASSWORD: qwerty1234
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user_qwerty -d strava_activity"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - backend
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: ["redis-server", "--save", "60", "1", "--loglevel", "warning"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - backend
volumes:
  pg_data:
  redis_data:

networks:
  app-shared-network:
    driver: bridge
    name: app-shared-network

  backend:
    driver: bridge
    name: backend

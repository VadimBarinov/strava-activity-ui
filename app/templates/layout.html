<!doctype html>
<html lang="ru">
  <head>
    {% block head %}
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <!-- Bootstrap 5 -->
    <link 
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" 
      rel="stylesheet" 
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" 
      crossorigin="anonymous"
    />
    <!-- Bootstrap Icons -->
    <link 
      rel="stylesheet" 
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css"
    />


    <!-- Leaflet -->
    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <!-- Polyline decoder (Mapbox polyline) -->
    <script src="https://unpkg.com/@mapbox/polyline@1.2.1/src/polyline.js"></script>

    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <title>{% block title %}{% endblock %} — Генератор Тест-Кейсов</title>
    {% endblock %}
  </head>
  <body class="bg-light">
    <!-- NAVBAR -->
    <nav class="navbar shadow-sm py-4">
      <div class="d-flex justify-content-between align-items-center container">
        <span class="navbar-brand mb-0 h1">
          <i class="bi bi-bar-chart-line-fill text-primary me-2"></i>
          Анализатор тренировок
        </span>
        
        <div class="d-flex align-items-center">
          <!-- <a class="btn btn-primary fw-bold" href="#">
            <i class="bi bi-strava me-2"></i>
            Войти через Strava
          </a> -->
          <p class="fw-bold mb-0 me-3">Баринов Вадим</p>
          <a class="btn btn-outline-primary fw-bold" href="#">
            <i class="bi bi-box-arrow-left me-2"></i>
            Выйти
          </a>
        </div>

      </div>
    </nav>

    <!-- CONTENT -->
    <main class="container py-5">
      <div id="content">{% block content %}{% endblock %}</div>
    </main>

    <!-- FOOTER -->
    <footer class="border-top mt-5 py-4 small">
      <div class="container d-flex justify-content-between align-items-center">
        {% block footer %}
        <div>
          <img 
            src="{{ url_for('static', filename='images/logo.svg') }}" 
            alt="VELIK"
            width="50"
            class="mb-3"
          />
          <div class="d-flex">
            <p class="mb-0">
            © 2026. Разработано в учебных целях.
            </p>
            <p class="text-primary mb-0">
              &nbspVelik
            </p>
          </div>
        </div>
        <div>
          <img 
            src="{{ url_for('static', filename='images/strava_logo.svg') }}" 
            alt="STRAVA"
            width="120"
          />
        </div>
        {% endblock %}
      </div>
    </footer>

    <!-- Bootstrap JS -->
    <script 
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" 
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" 
      crossorigin="anonymous"
    ></script>
  </body>
</html>
